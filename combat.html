<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Combattimento - Palazzo Eterno</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #0d0b09;
            color: #f1e7d0;
            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            min-height: 100vh;
            padding: 24px;
        }

        .combat-page {
            width: min(1200px, 100%);
            margin: 0 auto;
        }

        .combat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .combat-header h1 {
            margin: 0;
            font-size: 32px;
        }

        .combat-status {
            color: #cdbb9a;
            margin-top: 6px;
        }

        .combat-layout {
            display: grid;
            grid-template-columns:
                minmax(0, 1fr)
                280px;
            gap: 20px;
            align-items: start;
        }

        .combat-map-wrapper {
            background: #15110d;
            border: 1px solid #5c4529;
            border-radius: 12px;
            padding: 14px;
        }

        .combat-map {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 2px solid #7a5a31;
            background:
                linear-gradient(
                    rgba(255,255,255,.08) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.08) 1px,
                    transparent 1px
                ),
                #1c1711;
            background-size:
                calc(100% / 12)
                calc(100% / 12);
            overflow: hidden;
        }

        .combat-token {
            position: absolute;
            object-fit: contain;
            box-sizing: border-box;
            z-index: 20;
            transition:
                left .15s ease,
                top .15s ease;
        }

        .combat-token.player {
            filter:
                drop-shadow(
                    0 0 6px
                    rgba(90, 180, 255, .8)
                );
        }

        .combat-sidebar {
            background: #15110d;
            border: 1px solid #5c4529;
            border-radius: 12px;
            padding: 16px;
        }

        .combat-sidebar h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .combat-entity-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .combat-entity-item {
            padding: 10px;
            border: 1px solid #4c3a27;
            border-radius: 8px;
            background: #100d0a;
        }

        .combat-entity-item strong {
            display: block;
        }

        .combat-entity-meta {
            margin-top: 4px;
            font-size: 13px;
            color: #b8aa95;
        }

        .combat-master-badge {
            display: none;
            margin-top: 10px;
            color: #d8b15d;
            font-weight: 700;
        }

        .combat-master-badge.visible {
            display: block;
        }

        @media (max-width: 800px) {

            .combat-layout {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <main class="combat-page">

        <header class="combat-header">

            <div>

                <h1>
                    COMBATTIMENTO
                </h1>

                <div
                    id="combat-status"
                    class="combat-status"
                >
                    Caricamento...
                </div>

                <div
                    id="combat-master-badge"
                    class="combat-master-badge"
                >
                    MODALITÀ MASTER · OSSERVATORE
                </div>

            </div>

        </header>


        <section class="combat-layout">

            <div class="combat-map-wrapper">

                <div
                    id="combat-map"
                    class="combat-map"
                ></div>

            </div>


            <aside class="combat-sidebar">

                <h2>
                    PARTECIPANTI
                </h2>

                <div
                    id="combat-entity-list"
                    class="combat-entity-list"
                ></div>

            </aside>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/combat.js"></script>

</body>

</html>
