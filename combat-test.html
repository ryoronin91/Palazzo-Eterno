<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat Test</title>
</head>

<body>

    <h1>Combat Test</h1>

    <button id="test-combat-button">
        ENTRA IN COMBAT_1
    </button>

    <pre id="output"></pre>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>


    <script>

        const db =
            supabaseClient;


        const output =
            document.getElementById(
                "output"
            );


        const button =
            document.getElementById(
                "test-combat-button"
            );


        button.addEventListener(
            "click",
            async () => {

                output.textContent =
                    "Caricamento...";


                try {

                    // =========================================
                    // UTENTE
                    // =========================================

                    const {
                        data: {
                            user
                        },
                        error: authError
                    } =
                        await db.auth.getUser();


                    if (authError) {

                        throw authError;

                    }


                    if (!user) {

                        throw new Error(
                            "Utente non autenticato."
                        );

                    }


                    // =========================================
                    // PERSONAGGIO
                    // =========================================

                    const {
                        data: character,
                        error: characterError
                    } =
                        await db
                            .from(
                                "characters"
                            )
                            .select(
                                "id, nome, current_hp"
                            )
                            .eq(
                                "user_id",
                                user.id
                            )
                            .single();


                    if (characterError) {

                        throw characterError;

                    }


                    // =========================================
                    // JOIN COMBAT
                    // =========================================

                    const {
                        data,
                        error
                    } =
                        await db.rpc(
                            "join_combat_encounter",
                            {

                                p_encounter_id:
                                    "combat_1",

                                p_character_id:
                                    character.id

                            }
                        );


                    if (error) {

                        throw error;

                    }


                    output.textContent =
                        JSON.stringify(
                            {
                                character,
                                combat_result:
                                    data
                            },
                            null,
                            2
                        );


                } catch (error) {

                    console.error(
                        error
                    );


                    output.textContent =
                        "ERRORE:\n\n" +
                        (
                            error.message ||
                            String(error)
                        );

                }

            }
        );

    </script>

</body>
</html>
