<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accedi - Palazzo Eterno</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="home">

        <div class="home-card">

            <h1>ACCEDI</h1>

            <p>
                Entra nel Palazzo Eterno.
            </p>

            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="La tua email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="La tua password"
                        required
                    >

                </div>

                <p class="back-link" style="margin-top: -8px; margin-bottom: 20px;">
                    <a
                        href="#"
                        id="forgot-password-link"
                    >
                        Password dimenticata?
                    </a>
                </p>

                <button type="submit" class="button">
                    ACCEDI
                </button>

            </form>

            <div id="message"></div>

            <p class="back-link">
                Non hai ancora un account?
                <a href="registrazione.html">
                    Registrati
                </a>
            </p>

            <p class="back-link">
                <a href="index.html">
                    ← Torna alla home
                </a>
            </p>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js?v=2"></script>

</body>

</html>
