<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accedi - Palazzo Eterno</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="components/bacheca.css?v=16">
    <link rel="stylesheet" href="css/scheda-feedback.css?v=16">

    <style>
        html,
        body {
            min-height: 100%;
        }

        body {
            background-color: #08090b;
            background-image:
                linear-gradient(
                    rgba(5, 6, 8, 0.54),
                    rgba(5, 6, 8, 0.70)
                ),
                url("immagini/bg.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        @media (max-width: 820px) {
            body {
                background-attachment: scroll;
            }
        }

        /* Login e bacheca sono due riquadri distinti. */
        .home > .shared-noticeboard-host {
            margin-top: 34px;
        }

        .home > .shared-noticeboard-host .public-noticeboard {
            margin-top: 0;
        }

    </style>

</head>

<body>

    <main class="home">

        <div class="home-card">

            <h1>ACCEDI</h1>

            <p>
                Entra nel Palazzo Eterno.
            </p>

            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="La tua email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="La tua password"
                        required
                    >

                </div>

                <p class="back-link" style="margin-top: -8px; margin-bottom: 20px;">
                    <a
                        href="#"
                        id="forgot-password-link"
                    >
                        Password dimenticata?
                    </a>
                </p>

                <button type="submit" class="button">
                    ACCEDI
                </button>

            </form>

            <div id="message"></div>

            <p class="back-link">
                Non hai ancora un account?
                <a href="registrazione.html">
                    Registrati
                </a>
            </p>

            <p class="back-link">
                <a href="index.html">
                    ← Torna alla home
                </a>
            </p>

        </div>
            <div
                class="shared-noticeboard-host"
                data-noticeboard-mode="public"
            ></div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js?v=4"></script>
    <script src="components/bacheca.js?v=16"></script>
    <script src="js/scheda-feedback.js?v=16"></script>
</body>

</html>
