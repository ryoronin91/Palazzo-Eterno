<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palazzo Eterno - Vendor</title>

    <style>
        :root {
            --bg: #0d0d10;
            --panel: #17171c;
            --panel-soft: #202027;
            --border: #3f3f49;
            --border-strong: #8d7650;
            --text: #f0eee7;
            --muted: #b8b4aa;
            --gold: #d5b56a;
            --slot: #24242b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            min-height: 100vh;
            padding: 14px;
        }

        .vendor-page {
            width: min(1500px, 100%);
            min-height: calc(100vh - 28px);
            margin: 0 auto;

            display: grid;
            grid-template-columns:
                minmax(190px, 0.9fr)
                minmax(420px, 2.7fr)
                minmax(190px, 0.9fr);

            grid-template-rows:
                minmax(430px, 1fr)
                minmax(120px, 0.28fr);

            gap: 12px;
        }

        .vendor-panel {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.02),
                    rgba(0,0,0,0.10)
                ),
                var(--panel);

            border: 2px solid var(--border);
            border-radius: 8px;

            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.025),
                0 8px 22px rgba(0,0,0,0.24);
        }

        .panel-title {
            margin: 0;
            padding: 12px 14px 10px;

            color: var(--gold);
            border-bottom: 1px solid var(--border);

            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-align: center;
        }

        /* ====================================================
           1 - INVENTARIO PG
        ==================================================== */

        .player-inventory {
            grid-column: 1;
            grid-row: 1;

            display: flex;
            flex-direction: column;
        }

        .inventory-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .inventory-empty {
            min-height: 100%;
            display: grid;
            place-items: center;

            color: var(--muted);
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        /* ====================================================
           2 - IMMAGINE VENDOR
        ==================================================== */

        .vendor-portrait {
            grid-column: 2;
            grid-row: 1;

            display: flex;
            align-items: stretch;
            justify-content: center;

            background: #08080a;
            border-color: var(--border-strong);
        }

        .vendor-portrait img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center bottom;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ====================================================
           3 - INVENTARIO VENDOR
        ==================================================== */

        .vendor-inventory {
            grid-column: 3;
            grid-row: 1;

            display: flex;
            flex-direction: column;
        }

        .vendor-item {
            display: grid;
            grid-template-columns: 46px 1fr;
            gap: 10px;
            align-items: center;

            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--slot);
        }

        .vendor-item-icon {
            width: 46px;
            aspect-ratio: 1;
            display: grid;
            place-items: center;

            border: 1px solid #55545e;
            border-radius: 5px;

            font-family: Arial, sans-serif;
            font-size: 24px;
            background: #18181e;
        }

        .vendor-item-name {
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 14px;
        }

        .vendor-item-price {
            color: var(--gold);
            font-size: 13px;
        }

        /* ====================================================
           4 - DIALOGO VENDOR
        ==================================================== */

        .vendor-dialogue {
            grid-column: 2;
            grid-row: 2;

            padding: 18px 22px;

            display: flex;
            align-items: center;

            border-color: var(--border-strong);
        }

        .vendor-dialogue-content {
            width: 100%;
        }

        .vendor-dialogue-name {
            margin-bottom: 8px;

            color: var(--gold);
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.05em;
        }

        .vendor-dialogue-text {
            margin: 0;
            color: var(--text);
            font-size: 16px;
            line-height: 1.55;
        }

        /* ====================================================
           SPAZI VUOTI IN BASSO A SINISTRA/DESTRA
           come nello schema fornito
        ==================================================== */

        .vendor-bottom-left {
            grid-column: 1;
            grid-row: 2;
        }

        .vendor-bottom-right {
            grid-column: 3;
            grid-row: 2;
        }

        /* ====================================================
           RESPONSIVE
        ==================================================== */

        @media (max-width: 900px) {
            body {
                padding: 8px;
            }

            .vendor-page {
                min-height: auto;

                grid-template-columns: 1fr 1fr;
                grid-template-rows:
                    minmax(330px, 50vh)
                    auto
                    auto;

                gap: 8px;
            }

            .vendor-portrait {
                grid-column: 1 / 3;
                grid-row: 1;
            }

            .player-inventory {
                grid-column: 1;
                grid-row: 2;
                min-height: 260px;
            }

            .vendor-inventory {
                grid-column: 2;
                grid-row: 2;
                min-height: 260px;
            }

            .vendor-dialogue {
                grid-column: 1 / 3;
                grid-row: 3;
                min-height: 120px;
            }

            .vendor-bottom-left,
            .vendor-bottom-right {
                display: none;
            }
        }

        @media (max-width: 560px) {
            .vendor-page {
                display: flex;
                flex-direction: column;
            }

            .vendor-portrait {
                min-height: 300px;
            }

            .player-inventory,
            .vendor-inventory {
                min-height: 210px;
            }
        }
    </style>
</head>

<body>

    <main class="vendor-page">

        <!-- ==================================================
             1 - INVENTARIO PG
        =================================================== -->

        <section
            class="vendor-panel player-inventory"
            aria-label="Inventario personaggio"
        >
            <h2 class="panel-title">
                INVENTARIO PG
            </h2>

            <div
                id="player-inventory-list"
                class="inventory-scroll"
            >
                <div class="inventory-empty">
                    L'inventario del personaggio<br>
                    verrà caricato qui.
                </div>
            </div>
        </section>


        <!-- ==================================================
             2 - IMMAGINE VENDOR
        =================================================== -->

        <section
            class="vendor-panel vendor-portrait"
            aria-label="Vendor"
        >
            <img
                src="immagini/vendor/vendor_base.png"
                alt="Vendor"
            >
        </section>


        <!-- ==================================================
             3 - INVENTARIO VENDOR
        =================================================== -->

        <section
            class="vendor-panel vendor-inventory"
            aria-label="Inventario vendor"
        >
            <h2 class="panel-title">
                INVENTARIO VENDOR
            </h2>

            <div class="inventory-scroll">

                <article
                    class="vendor-item"
                    data-item-name="Pozione di Cura"
                    data-price="5"
                >
                    <div
                        class="vendor-item-icon"
                        aria-hidden="true"
                    >
                        ♥
                    </div>

                    <div>
                        <div class="vendor-item-name">
                            Pozione di Cura
                        </div>

                        <div class="vendor-item-price">
                            5 monete d'oro
                        </div>
                    </div>
                </article>

                <article
                    class="vendor-item"
                    data-item-name="Pozione di Mana"
                    data-price="5"
                >
                    <div
                        class="vendor-item-icon"
                        aria-hidden="true"
                    >
                        ✦
                    </div>

                    <div>
                        <div class="vendor-item-name">
                            Pozione di Mana
                        </div>

                        <div class="vendor-item-price">
                            5 monete d'oro
                        </div>
                    </div>
                </article>

            </div>
        </section>


        <!-- ==================================================
             4 - FINESTRA DI DIALOGO
        =================================================== -->

        <section
            class="vendor-panel vendor-dialogue"
            aria-label="Dialogo vendor"
        >
            <div class="vendor-dialogue-content">

                <div class="vendor-dialogue-name">
                    VENDOR
                </div>

                <p
                    id="vendor-dialogue-text"
                    class="vendor-dialogue-text"
                >
                    Benvenuto, viaggiatore. Dai un'occhiata alla mia merce.
                </p>

            </div>
        </section>


        <div
            class="vendor-bottom-left"
            aria-hidden="true"
        ></div>

        <div
            class="vendor-bottom-right"
            aria-hidden="true"
        ></div>

    </main>

</body>
</html>
