<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palazzo Eterno - Vendor</title>

    <style>
        :root {
            --bg: #0d0d10;
            --panel: #17171c;
            --border: #3f3f49;
            --border-strong: #8d7650;
            --text: #f0eee7;
            --muted: #b8b4aa;
            --gold: #d5b56a;
            --slot: #24242b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: var(--bg);
            color: var(--text);

            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            padding: 8px;
        }

        .vendor-page {
            width: 100%;
            height: calc(100vh - 16px);
            margin: 0 auto;

            display: grid;

            grid-template-columns:
                minmax(170px, 0.85fr)
                minmax(360px, 2.5fr)
                minmax(170px, 0.85fr);

            gap: 8px;
        }

        .vendor-panel {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,0.02),
                    rgba(0,0,0,0.10)
                ),
                var(--panel);

            border: 2px solid var(--border);
            border-radius: 7px;

            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.025),
                0 6px 18px rgba(0,0,0,0.24);
        }

        .panel-title {
            margin: 0;
            padding: 9px 10px 8px;

            color: var(--gold);
            border-bottom: 1px solid var(--border);

            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.07em;
            text-align: center;
        }

        /* ====================================================
           1 - INVENTARIO PG
        ==================================================== */

        .player-inventory {
            grid-column: 1;

            display: flex;
            flex-direction: column;

            min-height: 0;
        }

        .inventory-scroll {
            flex: 1;
            min-height: 0;

            overflow-y: auto;

            padding: 8px;
        }

        .inventory-empty {
            min-height: 100%;

            display: grid;
            place-items: center;

            color: var(--muted);
            text-align: center;

            font-size: 13px;
            line-height: 1.4;
        }

        /* ====================================================
           2 + 4 - VENDOR + DIALOGO SOVRAPPOSTO
        ==================================================== */

        .vendor-portrait {
            grid-column: 2;

            position: relative;

            display: flex;
            align-items: stretch;
            justify-content: center;

            min-height: 0;

            background: #08080a;

            border-color: var(--border-strong);
        }

        .vendor-portrait img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: center bottom;

            user-select: none;
            -webkit-user-drag: none;
        }

        .vendor-dialogue-overlay {
            position: absolute;

            left: 12px;
            right: 12px;
            bottom: 12px;

            min-height: 36%;
            max-height: 40%;

            padding: 18px 20px;

            display: flex;
            flex-direction: column;
            justify-content: flex-start;

            background: rgba(10, 10, 14, 0.68);

            border: 1px solid rgba(213, 181, 106, 0.78);
            border-radius: 8px;

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);

            box-shadow:
                0 4px 20px rgba(0,0,0,0.42);
        }

        .vendor-dialogue-name {
            margin-bottom: 8px;

            color: var(--gold);

            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .vendor-dialogue-text {
            margin: 0;

            color: var(--text);

            font-size: 16px;
            line-height: 1.55;
        }

        /* ====================================================
           3 - INVENTARIO VENDOR
        ==================================================== */

        .vendor-inventory {
            grid-column: 3;

            display: flex;
            flex-direction: column;

            min-height: 0;
        }

        .vendor-item {
            display: grid;

            grid-template-columns:
                40px
                1fr;

            gap: 8px;

            align-items: center;

            padding: 8px;

            border: 1px solid var(--border);
            border-radius: 6px;

            background: var(--slot);

            margin-bottom: 8px;
        }

        .vendor-item:last-child {
            margin-bottom: 0;
        }

        .vendor-item-icon {
            width: 40px;
            height: 40px;

            display: grid;
            place-items: center;

            border: 1px solid #55545e;
            border-radius: 5px;

            font-family: Arial, sans-serif;
            font-size: 21px;

            background: #18181e;
        }

        .vendor-item-name {
            margin-bottom: 4px;

            font-weight: 700;
            font-size: 13px;
        }

        .vendor-item-price {
            color: var(--gold);

            font-size: 12px;
        }

        /* ====================================================
           RESPONSIVE
        ==================================================== */

        @media (max-width: 900px) {

            html,
            body {
                overflow: auto;
            }

            body {
                padding: 6px;
            }

            .vendor-page {
                height: auto;

                grid-template-columns:
                    1fr 1fr;

                grid-template-rows:
                    minmax(360px, 55vh)
                    260px;
            }

            .vendor-portrait {
                grid-column: 1 / 3;
                grid-row: 1;
            }

            .player-inventory {
                grid-column: 1;
                grid-row: 2;
            }

            .vendor-inventory {
                grid-column: 2;
                grid-row: 2;
            }
        }

        @media (max-width: 560px) {

            .vendor-page {
                display: flex;
                flex-direction: column;
            }

            .vendor-portrait {
                min-height: 380px;
            }

            .player-inventory,
            .vendor-inventory {
                min-height: 210px;
            }

            .vendor-dialogue-overlay {
                left: 8px;
                right: 8px;
                bottom: 8px;

                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="vendor-page">

        <!-- ==================================================
             1 - INVENTARIO PG
        =================================================== -->

        <section
            class="vendor-panel player-inventory"
            aria-label="Inventario personaggio"
        >
            <h2 class="panel-title">
                INVENTARIO PG
            </h2>

            <div
                id="player-inventory-list"
                class="inventory-scroll"
            >
                <div class="inventory-empty">
                    L'inventario del personaggio<br>
                    verrà caricato qui.
                </div>
            </div>
        </section>


        <!-- ==================================================
             2 - IMMAGINE VENDOR
        =================================================== -->

        <section
            class="vendor-panel vendor-portrait"
            aria-label="Vendor"
        >
            <img
                src="immagini/vendor/vendor_base.png"
                alt="Vendor"
            >

            <div
                class="vendor-dialogue-overlay"
                aria-label="Dialogo vendor"
            >
                <div class="vendor-dialogue-name">
                    VENDOR
                </div>

                <p
                    id="vendor-dialogue-text"
                    class="vendor-dialogue-text"
                >
                    Benvenuto, viaggiatore. Dai un'occhiata alla mia merce.
                </p>
            </div>

        </section>


        <!-- ==================================================
             3 - INVENTARIO VENDOR
        =================================================== -->

        <section
            class="vendor-panel vendor-inventory"
            aria-label="Inventario vendor"
        >
            <h2 class="panel-title">
                INVENTARIO VENDOR
            </h2>

            <div class="inventory-scroll">

                <article
                    class="vendor-item"
                    data-item-name="Pozione di Cura"
                    data-price="5"
                >
                    <div
                        class="vendor-item-icon"
                        aria-hidden="true"
                    >
                        ♥
                    </div>

                    <div>
                        <div class="vendor-item-name">
                            Pozione di Cura
                        </div>

                        <div class="vendor-item-price">
                            5 monete d'oro
                        </div>
                    </div>
                </article>

                <article
                    class="vendor-item"
                    data-item-name="Pozione di Mana"
                    data-price="5"
                >
                    <div
                        class="vendor-item-icon"
                        aria-hidden="true"
                    >
                        ✦
                    </div>

                    <div>
                        <div class="vendor-item-name">
                            Pozione di Mana
                        </div>

                        <div class="vendor-item-price">
                            5 monete d'oro
                        </div>
                    </div>
                </article>

            </div>
        </section>


        <!-- ==================================================
             4 - FINESTRA DI DIALOGO
        =================================================== -->

    </main>

</body>
</html>
