<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palazzo Eterno - Vendor</title>
    <link rel="stylesheet" href="css/vendor.css?v=5">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js?v=11"></script>
</head>

<body>

    <main class="vendor-page">

        <!-- ==================================================
             INVENTARIO PG
        =================================================== -->

        <section
            class="merchant-panel player-inventory"
            aria-label="Inventario personaggio"
        >

            <div class="player-inventory-header">

                <div
                    id="player-inventory-title"
                    class="player-inventory-title"
                >
                    INVENTARIO PG
                </div>

                <div class="player-gold-line">

                    <span>
                        MONETE D'ORO
                    </span>

                    <strong id="player-gold-amount">
                        0
                    </strong>

                </div>

            </div>

            <div class="player-inventory-divider"></div>

            <div
                id="player-inventory-list"
                class="inventory-scroll"
            >
                <div class="player-inventory-status">
                    Caricamento inventario...
                </div>
            </div>

        </section>


        <!-- ==================================================
             VENDOR CENTRALE
        =================================================== -->

        <section
            class="vendor-portrait"
            aria-label="Vendor"
        >

            <button
                id="vendor-exit-button"
                class="vendor-exit-button"
                type="button"
            >
                ← ESCI
            </button>

            <img
                src="immagini/vendor/vendor_base.png"
                alt="Vendor"
            >

            <div
                class="vendor-dialogue-overlay"
                aria-label="Dialogo vendor"
            >

                <div class="vendor-dialogue-name">
                    MANO DI SCIMMIA
                </div>

                <div class="dialogue-mini-divider"></div>

                <div class="vendor-dialogue-body">

                    <p
                        id="vendor-dialogue-text"
                        class="vendor-dialogue-text"
                        aria-live="polite"
                    >
                        Weilà campione! Ti interessa una mano di scimmia quasi nuova?
                    </p>

                </div>

                <div
                    id="vendor-secret-offer"
                    class="vendor-secret-offer"
                    hidden
                ></div>

                <form
                    id="vendor-ai-form"
                    class="vendor-ai-form"
                    autocomplete="off"
                >

                    <input
                        id="vendor-ai-input"
                        class="vendor-ai-input"
                        type="text"
                        maxlength="500"
                        placeholder="Parla con Mano di Scimmia..."
                        aria-label="Parla con Mano di Scimmia"
                    >

                    <button
                        id="vendor-ai-send"
                        class="vendor-ai-send"
                        type="submit"
                    >
                        PARLA
                    </button>

                </form>

            </div>

        </section>


        <!-- ==================================================
             MERCE DISPONIBILE
        =================================================== -->

        <section
            class="merchant-panel vendor-inventory"
            aria-label="Merce disponibile"
        >

            <div class="ornate-heading">
                MERCE DISPONIBILE
            </div>

            <div class="ornate-subheading">
                La mercanzia del Palazzo.
            </div>

            <div class="ornate-divider"></div>

            <div class="vendor-stock">

                <article
                    class="vendor-stock-item"
                    data-item-name="Pozione cura vita"
                    data-price="5"
                >

                    <div class="vendor-stock-name">
                        Pozione cura vita
                    </div>

                    <div class="vendor-stock-price">
                        5
                    </div>

                    <button
                        class="merchant-button vendor-buy-button"
                        type="button"
                    >
                        COMPRA
                    </button>

                </article>


                <article
                    class="vendor-stock-item"
                    data-item-name="Pozione cura mana"
                    data-price="5"
                >

                    <div class="vendor-stock-name">
                        Pozione cura mana
                    </div>

                    <div class="vendor-stock-price">
                        5
                    </div>

                    <button
                        class="merchant-button vendor-buy-button"
                        type="button"
                    >
                        COMPRA
                    </button>

                </article>

            </div>

        </section>

    </main>


    <script src="js/vendor.js?v=16"></script>

</body>
</html>
