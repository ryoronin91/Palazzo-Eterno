name: Palazzo Eterno Custode
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simula senza cancellare dati'
        type: boolean
        default: true
        required: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUSTODE_DATABASE_URL: ${{ secrets.CUSTODE_DATABASE_URL }}
      CUSTODE_DELETE_ENABLED: ${{ vars.CUSTODE_DELETE_ENABLED == 'true' }}
      CUSTODE_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run && 'true' || 'false') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa dipendenze
        run: python -m pip install --disable-pip-version-check -r custode/requirements.txt
      - name: Analisi e pulizia controllata
        run: python custode/custode.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custode-report-${{ github.run_number }}
          path: custode-report/
          retention-days: 90
