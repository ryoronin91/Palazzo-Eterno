name: Palazzo Eterno Custode - Proposte
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custode-proposals
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUSTODE_DATABASE_URL: ${{ secrets.CUSTODE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa dipendenze
        run: python -m pip install --disable-pip-version-check -r custode/requirements.txt
      - name: Analizza e genera proposte (sola lettura)
        run: python custode/custode.py
      - name: Report proposte
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custode-proposte-${{ github.run_number }}
          path: custode-report/
          if-no-files-found: warn
          retention-days: 90
