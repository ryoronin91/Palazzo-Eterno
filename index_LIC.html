<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palazzo Eterno - Lavori in Corso</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
            width: 100%;
            box-sizing: border-box;
            border-bottom: 2px solid #333;
        }

        h1 {
            font-size: 2.5rem;
            color: #e50914;
            margin-0: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #cccccc;
            margin-bottom: 30px;
        }

        /* Avviso Lavori in Corso */
        .maintenance-box {
            background-color: #2d2d00;
            border: 2px dashed #ffcc00;
            color: #ffcc00;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        main {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Sezione Bacheca */
        .bacheca {
            background-color: #252525;
            border-radius: 8px;
            padding: 25px;
            margin-top: 30px;
            border: 1px solid #3a3a3a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .bacheca h2 {
            color: #ffffff;
            border-bottom: 2px solid #e50914;
            padding-bottom: 10px;
            margin-top: 0;
            text-transform: uppercase;
            font-size: 1.5rem;
        }

        .bacheca-tabs {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .tab {
            color: #aaaaaa;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
        }

        .tab:first-child {
            color: #e50914; /* Simula tab attiva */
        }

        .bacheca-content h3 {
            color: #ff3333;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>PALAZZO ETERNO</h1>
        <div class="subtitle">Un dungeon. Un gruppo di avventurieri. E qualcosa che vi sta aspettando.</div>
        
        <!-- Nuovo blocco di avviso (Sostituisce Accedi/Registrati) -->
        <div class="maintenance-box">
            🚧 LAVORI IN CORSO: IL PALAZZO TORNERÀ DISPONIBILE A BREVE 🚧
        </div>
    </header>

    <main>
        <!-- Struttura della Bacheca mantenuta -->
        <section class="bacheca">
            <h2>BACHECA</h2>
            
            <div class="bacheca-tabs">
                <span class="tab">NOVITÀ</span>
                <span class="tab">PROSSIMI UPGRADE</span>
                <span class="tab">AVVISI</span>
            </div>

            <div class="bacheca-content">
                <h3>COSA C'È DI NUOVO</h3>
                <p>Contenuto della bacheca in fase di aggiornamento...</p>
            </div>
        </section>
    </main>

</body>
</html>
