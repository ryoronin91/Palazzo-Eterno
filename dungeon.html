<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Palazzo Eterno - Piano 1
    </title>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/dungeon.css?v=11"
    >


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js?v=10"></script>

</head>


<body>


    <!-- =====================================================
         PAGINA DUNGEON
    ====================================================== -->

    <main class="dungeon-page">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="dungeon-header">


            <a
                href="scheda.html"
                class="dungeon-exit-button"
            >
                ESCI
            </a>


            <div class="dungeon-title-block">

                <h1>
                    PALAZZO ETERNO
                </h1>

                <div class="dungeon-floor-title">
                    PIANO 1
                </div>

            </div>


            <div
                id="dungeon-message"
                class="dungeon-message"
            >
                Caricamento...
            </div>


        </header>



        <!-- =================================================
             LAYOUT PRINCIPALE
        ================================================== -->

        <section class="dungeon-layout">


            <!-- =============================================
                 SINISTRA
                 CHAT
            ============================================== -->

            <aside class="dungeon-chat-column">


                <section class="dungeon-panel dungeon-chat-panel">


                    <div class="dungeon-panel-title">

                        CHAT

                    </div>


                    <div
                        id="floor-chat-messages"
                        class="floor-chat-messages"
                    >

                        <div class="chat-placeholder">

                            Nessun messaggio.

                        </div>

                    </div>


                    <div class="floor-chat-controls">


                        <input
                            id="floor-chat-input"
                            class="floor-chat-input"
                            type="text"
                            maxlength="300"
                            autocomplete="off"
                            placeholder="Scrivi..."
                        >


                        <button
                            id="floor-chat-send"
                            class="floor-chat-send"
                            type="button"
                            aria-label="Invia messaggio"
                        >
                            ➤
                        </button>


                    </div>


                </section>


            </aside>



            <!-- =============================================
                 CENTRO
                 MAPPA
            ============================================== -->

            <section class="dungeon-map-column">


                <div class="dungeon-map-frame">


                    <div
                        id="dungeon-map"
                        class="dungeon-map"
                    >


                        <!--
                            L'immagine della mappa rimane
                            separata dai token.
                        -->

                        <img
                            id="dungeon-map-image"
                            class="dungeon-map-image"
                            src="immagini/dungeon-test.png"
                            alt="Mappa del Piano 1"
                            draggable="false"
                        >


                        <!--
                            I token vengono inseriti qui
                            dal JavaScript.
                        -->


                    </div>


                </div>


                <!-- =========================================
                     COMANDI
                ========================================== -->

                <div class="dungeon-map-footer">


                    <div class="movement-help">

                        <span class="movement-key">
                            W
                        </span>

                        <span class="movement-key">
                            A
                        </span>

                        <span class="movement-key">
                            S
                        </span>

                        <span class="movement-key">
                            D
                        </span>


                        <span class="movement-description">

                            Muoviti con WASD, frecce
                            o clicca una casella adiacente.

                        </span>

                    </div>


                </div>


            </section>



            <!-- =============================================
                 DESTRA
            ============================================== -->

            <aside class="dungeon-character-column">


                <!-- =========================================
                     BLOCCO PERSONAGGIO
                ========================================== -->

                <section class="dungeon-character-summary">


                    <!-- NOME -->

                    <div
                        id="character-name"
                        class="dungeon-character-name"
                    >
                        PERSONAGGIO
                    </div>



                    <!-- =====================================
                         PARTE SUPERIORE
                    ====================================== -->

                    <div class="character-summary-top">


                        <!-- ===============================
                             RITRATTO
                        ================================ -->

                        <div class="character-portrait-wrapper">


                            <img
                                id="character-token"
                                class="character-portrait"
                                src=""
                                alt="Personaggio"
                                draggable="false"
                            >


                        </div>



                        <!-- ===============================
                             APRI SCHEDA
                        ================================ -->

                        <a
                            href="scheda.html"
                            class="open-sheet-button"
                        >
                            APRI SCHEDA
                        </a>


                    </div>



                    <!-- =====================================
                         STATISTICHE
                    ====================================== -->

                    <div class="quick-section">


                        <div class="quick-section-title">
                            STATISTICHE
                        </div>


                        <div class="quick-stat-grid">


                            <!-- ATT -->

                            <div class="quick-stat">

                                <span class="quick-stat-label">
                                    ATT
                                </span>

                                <strong
                                    id="attack-display"
                                    class="quick-stat-value"
                                >
                                    -
                                </strong>

                            </div>


                            <!-- DIF -->

                            <div class="quick-stat">

                                <span class="quick-stat-label">
                                    DIF
                                </span>

                                <strong
                                    id="defense-display"
                                    class="quick-stat-value"
                                >
                                    -
                                </strong>

                            </div>


                            <!-- VITA -->

                            <div class="quick-stat">

                                <span class="quick-stat-label">
                                    VITA
                                </span>

                                <strong
                                    id="health-display"
                                    class="quick-stat-value"
                                >
                                    -
                                </strong>

                            </div>


                            <!-- MANA -->

                            <div class="quick-stat">

                                <span class="quick-stat-label">
                                    MANA
                                </span>

                                <strong
                                    id="mana-display"
                                    class="quick-stat-value"
                                >
                                    -
                                </strong>

                            </div>


                            <!-- MOV -->

                            <div class="quick-stat">

                                <span class="quick-stat-label">
                                    MOV
                                </span>

                                <strong
                                    id="movement-display"
                                    class="quick-stat-value"
                                >
                                    -
                                </strong>

                            </div>


                            <!-- CRT -->

                            <div class="quick-stat">

                                <span class="quick-stat-label">
                                    CRT
                                </span>

                                <strong
                                    id="critical-display"
                                    class="quick-stat-value"
                                >
                                    -
                                </strong>

                            </div>


                        </div>


                    </div>



                    <!-- =====================================
                         ATTRIBUTI
                    ====================================== -->

                    <div class="quick-section">


                        <div class="quick-section-title">
                            ATTRIBUTI
                        </div>


                        <div class="quick-stat-grid">


                            <!-- FOR -->

                            <div class="quick-stat">

                                <span class="quick-stat-label">
                                    FOR
                                </span>

                                <strong
                                    id="forza-display"
                                    class="quick-stat-value"
                                >
                                    -
                                </strong>

                            </div>


                            <!-- RES -->

                            <div class="quick-stat">

                                <span class="quick-stat-label">
                                    RES
                                </span>

                                <strong
                                    id="resistenza-display"
                                    class="quick-stat-value"
                                >
                                    -
                                </strong>

                            </div>


                            <!-- COS -->

                            <div class="quick-stat">

                                <span class="quick-stat-label">
                                    COS
                                </span>

                                <strong
                                    id="costituzione-display"
                                    class="quick-stat-value"
                                >
                                    -
                                </strong>

                            </div>


                            <!-- INT -->

                            <div class="quick-stat">

                                <span class="quick-stat-label">
                                    INT
                                </span>

                                <strong
                                    id="intelligenza-display"
                                    class="quick-stat-value"
                                >
                                    -
                                </strong>

                            </div>


                            <!-- DES -->

                            <div class="quick-stat">

                                <span class="quick-stat-label">
                                    DES
                                </span>

                                <strong
                                    id="destrezza-display"
                                    class="quick-stat-value"
                                >
                                    -
                                </strong>

                            </div>


                            <!-- LCK -->

                            <div class="quick-stat">

                                <span class="quick-stat-label">
                                    LCK
                                </span>

                                <strong
                                    id="fortuna-display"
                                    class="quick-stat-value"
                                >
                                    -
                                </strong>

                            </div>


                        </div>


                    </div>


                    <!--
                        Manteniamo questo elemento nascosto
                        per compatibilità con eventuale codice
                        precedente.
                    -->

                    <span
                        id="character-level"
                        hidden
                    >
                        1
                    </span>


                    <span
                        id="character-name-panel"
                        hidden
                    ></span>


                </section>



                <!-- =========================================
                     SEPARATORE
                ========================================== -->

                <div class="dungeon-side-divider"></div>



                <!-- =========================================
                     AZIONI + NOTE
                ========================================== -->

                <section class="dungeon-action-column">


                    <!-- =====================================
                         ABILITÀ / CONSUMABILI
                    ====================================== -->

                    <div class="dungeon-actions-panel">


                        <div class="dungeon-actions-title">

                            ABILITÀ / CONSUMABILI

                        </div>



                        <!-- ===============================
                             SLOT 1 - CURA
                        ================================ -->

                        <button
                            id="dungeon-heal-button"
                            class="dungeon-action-card"
                            type="button"
                            data-action="heal"
                        >


                            <span class="action-card-icon">
                                ✦
                            </span>


                            <span class="action-card-content">

                                <strong>
                                    CURA
                                </strong>

                                <small>
                                    2 PM
                                </small>

                            </span>


                        </button>



                        <!-- ===============================
                             SLOT 2 - POZIONE VITA
                        ================================ -->

                        <button
                            id="dungeon-health-potion-button"
                            class="dungeon-action-card"
                            type="button"
                            data-action="health-potion"
                        >


                            <span class="action-card-icon">
                                ♥
                            </span>


                            <span class="action-card-content">

                                <strong>
                                    POZIONE DI VITA
                                </strong>

                                <small
                                    id="dungeon-health-potion-count"
                                >
                                    x0
                                </small>

                            </span>


                        </button>



                        <!-- ===============================
                             SLOT 3 - POZIONE MANA
                        ================================ -->

                        <button
                            id="dungeon-mana-potion-button"
                            class="dungeon-action-card"
                            type="button"
                            data-action="mana-potion"
                        >


                            <span class="action-card-icon">
                                ◆
                            </span>


                            <span class="action-card-content">

                                <strong>
                                    POZIONE DI MANA
                                </strong>

                                <small
                                    id="dungeon-mana-potion-count"
                                >
                                    x0
                                </small>

                            </span>


                        </button>



                        <!-- ===============================
                             PAGINAZIONE
                        ================================ -->

                        <div class="dungeon-action-pagination">


                            <button
                                id="dungeon-actions-prev"
                                class="action-page-button"
                                type="button"
                                disabled
                                aria-label="Pagina precedente"
                            >
                                ‹
                            </button>


                            <span
                                id="dungeon-actions-page"
                                class="action-page-number"
                            >
                                1
                            </span>


                            <button
                                id="dungeon-actions-next"
                                class="action-page-button"
                                type="button"
                                disabled
                                aria-label="Pagina successiva"
                            >
                                ›
                            </button>


                        </div>


                    </div>



                    <!-- =====================================
                         NOTE
                    ====================================== -->

                    <div class="dungeon-notes-panel">


                        <div class="dungeon-actions-title">

                            NOTE

                        </div>


                        <textarea
                            id="character-notes"
                            class="dungeon-notes"
                            maxlength="3000"
                            placeholder="Scrivi qui le tue note..."
                        ></textarea>


                        <button
                            id="save-notes-button"
                            class="save-notes-button"
                            type="button"
                        >
                            SALVA NOTE
                        </button>


                    </div>


                </section>


            </aside>


        </section>


    </main>



    <!-- =====================================================
         SCRIPT
    ====================================================== -->

    <script src="js/dungeon.js?v=10"></script>


</body>

</html>
