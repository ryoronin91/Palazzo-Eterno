<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Palazzo Eterno - Dungeon</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/dungeon.css?v=3"
    >

</head>


<body>

    <main class="dungeon-page">


        <!-- ==================================================
             INTESTAZIONE
        =================================================== -->

        <header class="dungeon-header">

            <div>

                <h1>PALAZZO ETERNO</h1>

                <p id="character-name">
                    Caricamento...
                </p>

            </div>


            <button
                id="logout-button"
                class="button secondary"
                type="button"
            >
                ESCI
            </button>

        </header>



        <!-- ==================================================
             CONTENITORE PRINCIPALE
        =================================================== -->

        <section class="dungeon-container">


            <!-- ==================================================
                 CHAT DEL PIANO
            =================================================== -->

            <aside class="dungeon-chat-panel" aria-label="Chat del piano">

                <div class="dungeon-chat-header">

                    <div>
                        <span class="panel-label">MULTIPLAYER</span>
                        <h2>CHAT DEL PIANO</h2>
                    </div>

                    <span
                        id="floor-chat-status"
                        class="floor-chat-status"
                    >
                        Connessione...
                    </span>

                </div>


                <div
                    id="floor-chat-messages"
                    class="floor-chat-messages"
                    role="log"
                    aria-live="polite"
                    aria-relevant="additions"
                >

                    <div class="floor-chat-empty">
                        I messaggi del piano compariranno qui.
                    </div>

                </div>


                <form
                    id="floor-chat-form"
                    class="floor-chat-form"
                >

                    <label
                        for="floor-chat-input"
                        class="floor-chat-label"
                    >
                        MESSAGGIO
                    </label>

                    <textarea
                        id="floor-chat-input"
                        class="floor-chat-input"
                        maxlength="300"
                        rows="3"
                        placeholder="Scrivi un messaggio..."
                    ></textarea>

                    <div class="floor-chat-actions">

                        <span
                            id="floor-chat-feedback"
                            class="floor-chat-feedback"
                        ></span>

                        <button
                            id="floor-chat-send"
                            class="button floor-chat-send"
                            type="submit"
                            disabled
                        >
                            INVIA
                        </button>

                    </div>

                </form>

            </aside>


            <!-- ==================================================
                 MAPPA
            =================================================== -->

            <div
                id="dungeon-map"
                class="dungeon-map"
            >

                <img
                    id="dungeon-image"
                    src="immagini/dungeon-test.png"
                    alt="Mappa del dungeon"
                >

            </div>



            <!-- ==================================================
                 SCHEDA PERSONAGGIO
            =================================================== -->

            <aside class="dungeon-character-panel">


                <!-- ==================================================
                     INTESTAZIONE
                =================================================== -->

                <div class="dungeon-character-header">

                    <div>

                        <span class="panel-label">
                            PERSONAGGIO
                        </span>

                        <h2 id="character-name-panel">
                            Caricamento...
                        </h2>

                    </div>


                    <div class="level-badge">

                        <span>
                            LIVELLO
                        </span>

                        <strong id="character-level">
                            1
                        </strong>

                    </div>

                </div>



                <!-- ==================================================
                     TOKEN
                =================================================== -->

                <div class="character-token-container">

                    <img
                        id="character-token"
                        src=""
                        alt="Token del personaggio"
                        class="character-token"
                    >

                </div>



                <!-- ==================================================
                     STATISTICHE SECONDARIE
                =================================================== -->

                <section class="character-section">

                    <h3>
                        STATISTICHE
                    </h3>


                    <div class="secondary-stats-grid">


                        <!-- FORZA -->

                        <div class="secondary-stat">

                            <span class="secondary-stat-name">
                                FORZA
                            </span>

                            <strong id="attack-display">
                                0
                            </strong>

                        </div>


                        <!-- RESISTENZA -->

                        <div class="secondary-stat">

                            <span class="secondary-stat-name">
                                RESISTENZA
                            </span>

                            <strong id="defense-display">
                                0
                            </strong>

                        </div>


                        <!-- VITA -->

                        <div class="secondary-stat">

                            <span class="secondary-stat-name">
                                VITA
                            </span>

                            <strong id="health-display">
                                0
                            </strong>

                        </div>


                        <!-- MANA -->

                        <div class="secondary-stat">

                            <span class="secondary-stat-name">
                                MANA
                            </span>

                            <strong id="mana-display">
                                0
                            </strong>

                        </div>


                        <!-- MOVIMENTO -->

                        <div class="secondary-stat">

                            <span class="secondary-stat-name">
                                MOVIMENTO
                            </span>

                            <strong id="movement-display">
                                0
                            </strong>

                        </div>


                        <!-- CRITICO -->

                        <div class="secondary-stat">

                            <span class="secondary-stat-name">
                                CRITICO
                            </span>

                            <strong id="critical-display">
                                0%
                            </strong>

                        </div>


                    </div>

                </section>



                <!-- ==================================================
                     ATTRIBUTI PRIMARI
                =================================================== -->

                <section class="character-section">

                    <h3>
                        ATTRIBUTI
                    </h3>


                    <div class="primary-stats-grid">


                        <div class="primary-stat">

                            <span>
                                FOR
                            </span>

                            <strong id="forza-display">
                                1
                            </strong>

                        </div>


                        <div class="primary-stat">

                            <span>
                                RES
                            </span>

                            <strong id="resistenza-display">
                                1
                            </strong>

                        </div>


                        <div class="primary-stat">

                            <span>
                                COS
                            </span>

                            <strong id="costituzione-display">
                                1
                            </strong>

                        </div>


                        <div class="primary-stat">

                            <span>
                                INT
                            </span>

                            <strong id="intelligenza-display">
                                1
                            </strong>

                        </div>


                        <div class="primary-stat">

                            <span>
                                DES
                            </span>

                            <strong id="destrezza-display">
                                1
                            </strong>

                        </div>


                        <div class="primary-stat">

                            <span>
                                LCK
                            </span>

                            <strong id="fortuna-display">
                                1
                            </strong>

                        </div>


                    </div>

                </section>



                <!-- ==================================================
                     NOTE
                =================================================== -->

                <section class="character-section notes-section">

                    <h3>
                        LE MIE NOTE
                    </h3>


                    <textarea
                        id="character-notes"
                        placeholder="Scrivi qui le tue note..."
                    ></textarea>


                    <button
                        type="button"
                        id="save-notes-button"
                        class="button save-notes-button"
                    >
                        SALVA NOTE
                    </button>


                    <div
                        id="notes-message"
                        class="notes-message"
                    ></div>

                </section>



                <!-- ==================================================
                     AZIONI
                =================================================== -->

                <div class="character-actions">

                    <a
                        href="scheda.html"
                        class="button secondary"
                    >
                        APRI SCHEDA
                    </a>

                </div>


            </aside>

        </section>



        <!-- ==================================================
             MESSAGGI
        =================================================== -->

        <div
            id="dungeon-message"
            class="dungeon-message"
        ></div>


    </main>



    <!-- ======================================================
         SUPABASE
    ======================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- ======================================================
         CONFIGURAZIONE
    ======================================================= -->

    <script src="js/config.js?v=2"></script>


    <!-- ======================================================
         DUNGEON
    ======================================================= -->

    <script src="js/dungeon.js?v=3"></script>


</body>

</html>
