<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palazzo Eterno — Guardie del Varco</title>

<body><main class="page"><header><a id="exit" href="piano-Ia.html">← TORNA AL PIANO I-A</a><h1>GUARDIE DEL VARCO</h1><small>CONFINE IA / IB</small></header>
<div class="layout"><section class="stage" aria-label="Le guardie e il dialogo"><div class="portrait" id="guard-portrait" role="img" aria-label="Le guardie del varco"></div>
