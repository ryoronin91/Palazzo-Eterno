<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e6f1e6">
  <title>Palazzo Eterno — Sigillo di Scintilla</title>
  <link rel="stylesheet" href="puzzle.css">
  <script defer src="puzzle.js"></script>
</head>
<body>
  <a id="puzzle-back" class="puzzle-button exit" href="../piano-Id.html">ESCI</a>
  <main class="puzzle-stage">
    <div class="puzzle-board" aria-label="Sigillo delle Undici Memorie">
      <div id="puzzle-grid" class="puzzle-grid" role="group" aria-label="Puzzle scorrevole: quattro colonne, tre righe, undici tessere e uno spazio vuoto"></div>
    </div>
    <div class="puzzle-actions">
      <button id="reset-button" class="puzzle-button" type="button">RIMESCOLA</button>
      <button id="verify-button" class="puzzle-button" type="button">VERIFICA SIGILLO</button>
    </div>
    <div id="puzzle-message" class="puzzle-message" role="status" aria-live="polite" hidden></div>
  </main>
</body>
</html>
