<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>La mia scheda - Palazzo Eterno</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* =====================================================
           PAGINA SCHEDA PERSONAGGIO
           ===================================================== */

        .character-sheet-page {

            min-height: 100vh;

            padding: 30px 20px;

            box-sizing: border-box;

        }


        .character-sheet {

            width: 100%;

            max-width: 1100px;

            margin: 0 auto;

            background: rgba(20, 20, 20, 0.96);

            border-radius: 18px;

            padding: 30px;

            box-sizing: border-box;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.45);

        }


        /* =====================================================
           INTESTAZIONE
           ===================================================== */

        .sheet-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;

        }


        .sheet-header h1 {

            margin: 0;

        }


        .sheet-header p {

            margin: 6px 0 0;

            opacity: 0.7;

        }


        .sheet-header-buttons {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            justify-content: flex-end;

        }


        /* =====================================================
           IDENTITÀ
           ===================================================== */

        .identity-section {

            display: grid;

            grid-template-columns:
                180px
                1fr;

            gap: 30px;

            align-items: center;

            margin-bottom: 35px;

        }


        /* =====================================================
           TOKEN
           ===================================================== */

        .character-token-container {

            width: 180px;

            height: 180px;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .character-token {

            width: 100%;

            height: 100%;

            object-fit: contain;

            display: block;

        }


        /* =====================================================
           NOME / LIVELLO
           ===================================================== */

        .character-name {

            font-size: 38px;

            font-weight: bold;

            margin: 0 0 8px;

        }


        .character-level {

            font-size: 20px;

            opacity: 0.8;

            margin-bottom: 20px;

        }


        /* =====================================================
           ATTRIBUTI
           ===================================================== */

        .attributes-section {

            margin-bottom: 35px;

        }


        .attributes-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

        }


        .attribute-box {

            background: rgba(255, 255, 255, 0.06);

            border-radius: 12px;

            padding: 18px;

            text-align: center;

            box-sizing: border-box;

        }


        .attribute-label {

            font-size: 14px;

            opacity: 0.65;

            margin-bottom: 8px;

        }


        .attribute-name {

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 8px;

        }


        .attribute-value {

            font-size: 32px;

            font-weight: bold;

        }


        /* =====================================================
           STATISTICHE SECONDARIE
           ===================================================== */

        .secondary-section {

            margin-bottom: 35px;

        }


        .secondary-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

        }


        .secondary-box {

            background: rgba(255, 255, 255, 0.06);

            border-radius: 12px;

            padding: 18px;

            text-align: center;

        }


        .secondary-name {

            font-size: 15px;

            opacity: 0.7;

            margin-bottom: 8px;

        }


        .secondary-value {

            font-size: 30px;

            font-weight: bold;

        }


        /* =====================================================
           NOTE
           ===================================================== */

        .notes-section {

            margin-top: 10px;

        }


        .notes-section textarea {

            width: 100%;

            min-height: 220px;

            resize: vertical;

            box-sizing: border-box;

            padding: 15px;

            border-radius: 12px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            background: rgba(0, 0, 0, 0.3);

            color: inherit;

            font-family: inherit;

            font-size: 16px;

            line-height: 1.5;

        }


        .notes-section textarea:focus {

            outline: none;

            border-color: rgba(255, 255, 255, 0.4);

        }


        .notes-actions {

            margin-top: 12px;

            display: flex;

            justify-content: flex-end;

        }


        /* =====================================================
           MESSAGGI
           ===================================================== */

        #sheet-message {

            margin-top: 15px;

            min-height: 24px;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            .character-sheet-page {

                padding: 15px 10px;

            }


            .character-sheet {

                padding: 20px 15px;

                border-radius: 14px;

            }


            .sheet-header {

                flex-direction: column;

                align-items: flex-start;

            }


            .sheet-header-buttons {

                width: 100%;

                justify-content: flex-start;

            }


            .identity-section {

                grid-template-columns: 1fr;

                text-align: center;

            }


            .character-token-container {

                width: 150px;

                height: 150px;

                margin: 0 auto;

            }


            .character-name {

                font-size: 30px;

            }


            .attributes-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .secondary-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media (max-width: 430px) {

            .attributes-grid,
            .secondary-grid {

                grid-template-columns: 1fr;

            }


            .character-name {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>

    <main class="character-sheet-page">

        <div class="character-sheet">


            <!-- =================================================
                 INTESTAZIONE
                 ================================================= -->

            <header class="sheet-header">

                <div>

                    <h1>LA MIA SCHEDA</h1>

                    <p id="user-email">
                        Caricamento...
                    </p>

                </div>


                <div class="sheet-header-buttons">

                    <a
                        href="dungeon.html"
                        class="button"
                    >
                        ENTRA NEL DUNGEON
                    </a>


                    <a
                        id="master-entry-button"
                        href="master.html"
                        class="button secondary"
                        style="display: none;"
                    >
                        ENTRA DA MASTER
                    </a>


                    <button
                        id="logout-button"
                        class="button secondary"
                        type="button"
                    >
                        ESCI
                    </button>

                </div>

            </header>


            <!-- =================================================
                 IDENTITÀ
                 ================================================= -->

            <section class="identity-section">


                <div class="character-token-container">

                    <img
                        id="character-token"
                        class="character-token"
                        src=""
                        alt="Token del personaggio"
                    >

                </div>


                <div>

                    <h2
                        id="character-name"
                        class="character-name"
                    >
                        Caricamento...
                    </h2>


                    <div
                        id="character-level"
                        class="character-level"
                    >
                        Livello 1
                    </div>

                </div>


            </section>


            <!-- =================================================
                 ATTRIBUTI PRIMARI
                 ================================================= -->

            <section class="attributes-section">

                <h2>Attributi</h2>


                <div class="attributes-grid">


                    <div class="attribute-box">

                        <div class="attribute-label">
                            FOR
                        </div>

                        <div class="attribute-name">
                            FORZA
                        </div>

                        <div
                            id="forza-display"
                            class="attribute-value"
                        >
                            1
                        </div>

                    </div>


                    <div class="attribute-box">

                        <div class="attribute-label">
                            RES
                        </div>

                        <div class="attribute-name">
                            RESISTENZA
                        </div>

                        <div
                            id="resistenza-display"
                            class="attribute-value"
                        >
                            1
                        </div>

                    </div>


                    <div class="attribute-box">

                        <div class="attribute-label">
                            COS
                        </div>

                        <div class="attribute-name">
                            COSTITUZIONE
                        </div>

                        <div
                            id="costituzione-display"
                            class="attribute-value"
                        >
                            1
                        </div>

                    </div>


                    <div class="attribute-box">

                        <div class="attribute-label">
                            INT
                        </div>

                        <div class="attribute-name">
                            INTELLIGENZA
                        </div>

                        <div
                            id="intelligenza-display"
                            class="attribute-value"
                        >
                            1
                        </div>

                    </div>


                    <div class="attribute-box">

                        <div class="attribute-label">
                            DES
                        </div>

                        <div class="attribute-name">
                            DESTREZZA
                        </div>

                        <div
                            id="destrezza-display"
                            class="attribute-value"
                        >
                            1
                        </div>

                    </div>


                    <div class="attribute-box">

                        <div class="attribute-label">
                            LCK
                        </div>

                        <div class="attribute-name">
                            FORTUNA
                        </div>

                        <div
                            id="fortuna-display"
                            class="attribute-value"
                        >
                            1
                        </div>

                    </div>


                </div>

            </section>


            <!-- =================================================
                 STATISTICHE SECONDARIE
                 ================================================= -->

            <section class="secondary-section">

                <h2>Statistiche</h2>


                <div class="secondary-grid">


                    <div class="secondary-box">

                        <div class="secondary-name">
                            ATTACCO
                        </div>

                        <div
                            id="attack-display"
                            class="secondary-value"
                        >
                            1
                        </div>

                    </div>


                    <div class="secondary-box">

                        <div class="secondary-name">
                            DIFESA
                        </div>

                        <div
                            id="defense-display"
                            class="secondary-value"
                        >
                            8
                        </div>

                    </div>


                    <div class="secondary-box">

                        <div class="secondary-name">
                            VITA
                        </div>

                        <div
                            id="life-display"
                            class="secondary-value"
                        >
                            5
                        </div>

                    </div>


                    <div class="secondary-box">

                        <div class="secondary-name">
                            MANA
                        </div>

                        <div
                            id="mana-display"
                            class="secondary-value"
                        >
                            5
                        </div>

                    </div>


                    <div class="secondary-box">

                        <div class="secondary-name">
                            MOVIMENTO
                        </div>

                        <div
                            id="movement-display"
                            class="secondary-value"
                        >
                            5
                        </div>

                    </div>


                    <div class="secondary-box">

                        <div class="secondary-name">
                            CRITICO
                        </div>

                        <div
                            id="critical-display"
                            class="secondary-value"
                        >
                            17%
                        </div>

                    </div>


                </div>

            </section>


            <!-- =================================================
                 NOTE
                 ================================================= -->

            <section class="notes-section">

                <h2>Note del personaggio</h2>

                <textarea
                    id="character-notes"
                    placeholder="Scrivi qui appunti, indizi, informazioni sui personaggi incontrati, oggetti importanti o qualsiasi altra cosa tu voglia ricordare..."
                ></textarea>


                <div class="notes-actions">

                    <button
                        id="save-notes-button"
                        class="button"
                        type="button"
                    >
                        SALVA NOTE
                    </button>

                </div>


                <div id="sheet-message"></div>

            </section>


        </div>

    </main>


    <!-- =======================================================
         SUPABASE
         ======================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/scheda.js"></script>

</body>

</html>
